<!doctype html>
<!--
  jianjian starter animation: a panel with a title and steps, each step appearing on the word
  that introduces it. Copy it next to your animations.json and fill "data" there:

    {"html": "steps.html", "from": 125.4, "to": 133.0,
     "beats": {"retrieve": 126.8, "generate": 129.9},
     "data": {"title": "RAG 检索增强生成",
              "steps": [{"text": "检索 Retrieve", "beat": "retrieve"},
                        {"text": "生成 Generate", "beat": "generate"}]}}

  jianjian sets the root's duration and size and defines window.jianjian before this page's scripts
  (duration, width, height, fps, beats in seconds from the start, words, data). Keep the background
  transparent: the talk plays underneath.

  Where it goes ("layout" in data), clear of faces and of the subtitles at the bottom:
    "panel" (default)  a box in the top right, for one speaker filling the frame
    "band"             a strip across the top, title and steps in a row, for a video call or a
                       frame with an empty band above the picture
-->
<html lang="zh">
  <head>
    <meta charset="UTF-8" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      /* system fonts need a declaration, or HyperFrames' lint refuses the render (--strict) */
      @font-face { font-family: "PingFang SC"; src: local("PingFang SC"); }
      @font-face { font-family: "Noto Sans CJK SC"; src: local("Noto Sans CJK SC"); }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { overflow: hidden; background: transparent; }
      #panel { position: absolute; right: 4%; top: 10%; width: 36%; padding: 2.2vw 2.4vw;
               border-radius: 1.4vw; background: rgba(15, 23, 42, 0.86); color: #f8fafc;
               font-family: "PingFang SC", "Noto Sans CJK SC", sans-serif; }
      #title { font-size: 2.6vw; font-weight: 700; margin-bottom: 1.2vw; }
      .step { display: flex; align-items: center; gap: 1vw; font-size: 2vw; font-weight: 500;
              margin-top: 0.9vw; opacity: 0; }
      body.band #panel { left: 3%; right: 3%; top: 3%; width: auto; display: flex; align-items: center;
                         gap: 2.4vw; padding: 1.2vw 2vw; }
      body.band #title { margin: 0; flex: none; }
      body.band #steps { display: flex; gap: 2.2vw; flex-wrap: wrap; }
      body.band .step { margin: 0; }
      .num { flex: none; width: 2.6vw; height: 2.6vw; border-radius: 50%; background: #38bdf8;
             color: #0f172a; font-weight: 700; display: flex; align-items: center; justify-content: center; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="auto">
      <div id="panel" class="clip" data-start="0" data-duration="auto">
        <div id="title"></div>
        <div id="steps"></div>
      </div>
    </div>
    <script>
      const jj = window.jianjian || { duration: 6, width: 1920, height: 1080, beats: {}, data: {} };
      document.documentElement.style.width = document.body.style.width = jj.width + "px";
      document.documentElement.style.height = document.body.style.height = jj.height + "px";
      const data = jj.data || {};
      if (data.layout === "band") document.body.classList.add("band");
      document.getElementById("title").textContent = data.title || "";
      const steps = data.steps || [];
      const box = document.getElementById("steps");
      steps.forEach((s, i) => {
        const el = document.createElement("div");
        el.className = "step";
        el.id = "step" + i;
        el.innerHTML = '<span class="num">' + (i + 1) + "</span><span></span>";
        el.lastChild.textContent = s.text;
        box.appendChild(el);
      });

      const tl = gsap.timeline({ paused: true });
      tl.from("#panel", { opacity: 0, x: 40, duration: 0.4, ease: "power2.out" }, 0);
      steps.forEach((s, i) => {
        // a step without a beat follows the previous one by a second
        const at = s.beat in jj.beats ? jj.beats[s.beat] : 0.6 + i;
        tl.fromTo("#step" + i, { opacity: 0, x: 24 }, { opacity: 1, x: 0, duration: 0.35, ease: "power2.out" }, at);
      });
      tl.to("#panel", { opacity: 0, duration: 0.3 }, Math.max(0, jj.duration - 0.3));
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
