name: tests

on:
  push:
  pull_request:

jobs:
  unit:
    # the unit tests need no models, MLX or a Mac
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy jieba opencc-python-reimplemented -r requirements-dev.txt
      - run: python -m pytest -q
